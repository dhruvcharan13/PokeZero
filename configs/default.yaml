# Full list of knobs; any value can be overridden on the CLI: pokezero train selfplay.games_per_iter=8
run_name: default
artifact_root: runs
seed: 0
iterations: 5
net: {card_dim: 64, slot_dim: 128, hidden: 512, state_dim: 256, action_dim: 128}
selfplay:
  games_per_iter: 8
  temperature: 1.0
  temperature_moves: 12
  search:
    simulations: 32
    c_puct: 1.5
    dirichlet_alpha: 0.3
    dirichlet_eps: 0.25
    max_chance_children: 4
    chance_probe: 3
    max_depth: 40
    reuse_tree: true
    allow_engine_oracle: true   # research-only: engine search leaks the opponent's hand
replay: {max_examples: 20000}
train: {batch_size: 128, steps_per_iter: 200, lr: 0.001, weight_decay: 0.0001, value_coef: 1.0, grad_clip: 1.0, min_examples: 256}
eval: {games: 20, promote_threshold: 0.55, use_search: false, search_simulations: 16, baseline_games: 10}
wandb: {enabled: false, project: pokezero, entity: "", run_name: "", mode: online}
